<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einfache Seite</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 2.5rem;
    width: min(420px, 90vw);
    text-align: center;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
  }

  h1 {
    margin-top: 0;
    font-size: 1.8rem;
  }

  p {
    color: var(--muted);
    line-height: 1.5;
  }

  button {
    margin-top: 1rem;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button:hover {
    background: #7dd3fc;
    transform: translateY(-2px);
  }

  .btn-row {
    display: flex;
    gap: 0.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--muted);
  }

  button.secondary:hover {
    background: var(--muted);
    color: var(--card);
  }

  #counter {
    font-size: 2.5rem;
    font-weight: bold;
    margin: 1rem 0;
    color: var(--accent);
  }

  #time {
    margin-top: 1.5rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="card">
  <h1>Willkommen!</h1>
  <p>Eine einfache HTML-Seite mit eingebettetem CSS und JavaScript.</p>

  <div id="counter">0</div>
  <div class="btn-row">
    <button id="incrementBtn">Klick mich</button>
    <button id="resetBtn" class="secondary">Reset</button>
  </div>

  <div id="time">Aktuelle Uhrzeit: <span id="clock">--:--:--</span></div>
</div>

<script>
  let count = 0;
  const counterEl = document.getElementById('counter');
  const btn = document.getElementById('incrementBtn');
  const resetBtn = document.getElementById('resetBtn');

  btn.addEventListener('click', () => {
    count++;
    counterEl.textContent = count;
  });

  resetBtn.addEventListener('click', () => {
    count = 0;
    counterEl.textContent = count;
  });

  const clockEl = document.getElementById('clock');
  function updateClock() {
    const now = new Date();
    clockEl.textContent = now.toLocaleTimeString('de-DE');
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
